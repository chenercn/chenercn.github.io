<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f2" />
  <meta name="description" content="2楼至8楼房间巡查记录，支持双房号、Closed及一至五星评价，并按日期保留记录。" />
  <title>房间巡查记录</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="note-header">
      <div class="eyebrow">巡查记录</div>
      <input id="location" class="title-input" type="text" placeholder="点击填写位置" aria-label="位置" autocomplete="off" />
      <div class="meta-row">
        <label class="date-field">
          <span>日期</span>
          <input id="recordDate" type="date" aria-label="巡查日期" />
        </label>
        <div id="progressText" class="progress-text" aria-live="polite">已记录 0 / 616</div>
        <button id="clearAll" class="clear-all-btn" type="button">清空全部</button>
      </div>
    </header>

    <nav id="floorNav" class="floor-nav" aria-label="楼层导航"></nav>
    <nav id="starFilter" class="star-filter" aria-label="按星级筛选"></nav>

    <div id="filterEmpty" class="filter-empty" hidden></div>
    <section id="roomList" class="room-list" aria-label="房间列表"></section>
  </main>

  <div id="saveToast" class="save-toast" role="status" aria-live="polite">已自动保存</div>
  <script src="./app.js"></script>
</body>
</html>
