name: Build Offline iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-offline/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare project
        working-directory: ios-offline
        run: |
          openssl base64 -d -in AppIcon.png.base64 -out RoomChecklist/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate

      - name: Build unsigned app
        working-directory: ios-offline
        run: |
          xcodebuild \
            -project RoomChecklist.xcodeproj \
            -scheme RoomChecklist \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios-offline
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoomChecklist.app Payload/
          zip -qry RoomChecklist-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoomChecklist-unsigned-IPA
          path: ios-offline/RoomChecklist-unsigned.ipa
          if-no-files-found: error
